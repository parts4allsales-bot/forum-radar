"Γενικά"       = ["ανταλλακτικό", "ανταλλακτικά", "κωδικός", "κωδικό"]

[keywords]
# Φράσεις που δείχνουν ότι κάποιος ΨΑΧΝΕΙ να αγοράσει ή χρειάζεται βοήθεια
intent = ["ψάχνω", "πού θα βρω", "πού να βρω", "πού βρίσκω", "ξέρει κανείς", "ποιο ταιριάζει", "ποιο να πάρω", "τι να πάρω", "προτείνετε", "τιμή", "πόσο κάνει", "κοστίζει", "θόρυβος", "τρακάρει", "χτυπάει", "τρίζει", "αλλαγή", "να αλλάξω", "χάλασε", "βοήθεια"]
