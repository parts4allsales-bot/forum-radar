# ============================================================
#  ΡΑΝΤΑΡ ΣΥΖΗΤΗΣΕΩΝ — ρυθμίσεις
#  Άλλαξε ό,τι θέλεις εδώ (κουμπί ✏️ στο GitHub). Γραμμές που ξεκινούν με # αγνοούνται.
# ============================================================

[store]
name = "parts4all.gr"
# Σύνδεσμος αναζήτησης του καταστήματος. Το {q} γίνεται π.χ. "τακάκια golf 7".
# (OpenCart: index.php?route=product/search&search={q})
search_url = "https://parts4all.gr/index.php?route=product/search&search={q}"

[settings]
days_back = 7        # πόσο παλιές συζητήσεις να δείχνει
min_score = 3        # πόσο "σίγουρο" πρέπει να είναι ένα αποτέλεσμα (2 = περισσότερα, 4 = λιγότερα)
report_file = "docs/index.html"
catalog_file = "catalog.xlsx"   # οι τίτλοι προϊόντων σου (στήλη Α κωδικός, Β τίτλος)
require_vehicle = true          # να δείχνει μόνο συζητήσεις με μάρκα/μοντέλο ή κωδικό OE

# ------------------------------------------------------------
#  ΠΗΓΕΣ RSS — fora, Reddit, Google Alerts
#  Πρόσθεσε όσες θέλεις, η καθεμία σε δικό της [[feeds]].
# ------------------------------------------------------------

[[feeds]]
name = "Reddit r/greece"
url  = "https://www.reddit.com/r/greece/search.rss?q=ανταλλακτικό+OR+ανταλλακτικά+OR+συνεργείο+OR+τακάκια+OR+αμορτισέρ+OR+βλάβη+OR+θόρυβος&restrict_sr=on&sort=new"

# Google Alerts (δωρεάν, καλύπτει όλο το διαδίκτυο):
# 1. Πήγαινε στο google.com/alerts, γράψε π.χ.  ψάχνω τακάκια golf
# 2. "Εμφάνιση επιλογών" → Παράδοση σε: "Ροή RSS" → Δημιουργία
# 3. Πάτα το εικονίδιο RSS, αντέγραψε τη διεύθυνση και βάλ' τη εδώ:
# [[feeds]]
# name = "Google Alert – τακάκια golf"
# url  = "https://www.google.com/alerts/feeds/XXXXXXXX/YYYYYYYY"

# Fora με RSS (ψάξε το πορτοκαλί εικονίδιο RSS στη σελίδα του forum):
#   XenForo:   https://FORUM/forums/-/index.rss
#   phpBB:     https://FORUM/app.php/feed   ή  https://FORUM/feed.php
#   vBulletin: https://FORUM/external.php?type=RSS2
# [[feeds]]
# name = "Παράδειγμα forum"
# url  = "https://forum.example.gr/forums/-/index.rss"

# ------------------------------------------------------------
#  ΧΕΙΡΟΚΙΝΗΤΟΙ ΕΛΕΓΧΟΙ — Facebook, Instagram, TikTok, X, car.gr
#  Αυτά δεν διαβάζονται αυτόματα. Η αναφορά σου βγάζει έτοιμα links
#  αναζήτησης· τα ανοίγεις με τον δικό σου λογαριασμό.
# ------------------------------------------------------------

[manual]
# Λέξεις που θα ψάχνει σε κάθε πλατφόρμα
searches = ["ψάχνω ανταλλακτικό", "τακάκια golf", "αμορτισέρ bmw", "πολλαπλασιαστής", "ακρόμπαρα"]

# Facebook ομάδες: βάλε το κομμάτι του link μετά το /groups/
# π.χ. για facebook.com/groups/groupvaggreece βάζεις "groupvaggreece"
facebook_groups = []

# Hashtags για Instagram/TikTok (χωρίς #)
hashtags = ["golfmk4", "golfmk5", "bmwe46", "bmwe90", "audia3", "mercedesw203", "toyotayaris", "carsgreece"]

# ------------------------------------------------------------
#  ΛΕΞΕΙΣ-ΚΛΕΙΔΙΑ (τόνοι και κεφαλαία δεν παίζουν ρόλο)
# ------------------------------------------------------------

[keywords.brands]
VW       = ["VW", "Volkswagen", "Φολξ", "Golf", "Γκολφ", "Polo", "Πόλο", "Passat", "Πασάτ", "Jetta", "Touran", "Caddy", "Tiguan", "Bora", "Lupo", "Fox", "Up"]
Audi     = ["Audi", "Άουντι", "A1", "A3", "A4", "A5", "A6", "Q3", "Q5", "Q7", "TT"]
BMW      = ["BMW", "Μπέμβε", "E36", "E46", "E39", "E60", "E87", "E90", "E91", "E92", "F10", "F20", "F30", "X1", "X3", "X5", "Σειρά 1", "Σειρά 3", "Σειρά 5"]
Mercedes = ["Mercedes", "Μερσεντές", "Benz", "W202", "W203", "W204", "W205", "W210", "W211", "W212", "W168", "W169", "W176", "C180", "C200", "C220", "E220", "A160", "A180", "Vito", "Sprinter", "CLA", "GLA"]
Toyota   = ["Toyota", "Τογιότα", "Yaris", "Γιάρις", "Corolla", "Κορόλα", "Auris", "Avensis", "Aygo", "RAV4", "Hilux", "Prius", "CHR", "C-HR", "Verso"]
"Άλλες"  = ["Seat", "Ibiza", "Leon", "Skoda", "Octavia", "Fabia", "Opel", "Corsa", "Astra", "Ford", "Fiesta", "Focus", "Fiat", "Punto", "Peugeot", "Citroen", "Renault", "Clio", "Nissan", "Micra", "Qashqai", "Hyundai", "i10", "i20", "Kia", "Suzuki", "Swift", "Honda", "Civic", "Mazda", "Jeep", "Volvo", "Land Rover", "Range Rover", "Chrysler", "Lexus", "Alfa Romeo", "Subaru", "Dacia", "Dodge", "Porsche", "Iveco", "Mitsubishi", "Chevrolet", "Daewoo", "Saab", "Daihatsu", "Lancia", "Jaguar", "Infiniti", "SsangYong", "Isuzu"]

# Γράψε κάθε λέξη όπως θες να φαίνεται (με τόνους)· στην αναζήτηση δεν μετράνε τόνοι/κεφαλαία.
[keywords.parts]
"Φρένα"        = ["τακάκια", "τακάκι", "δισκόπλακες", "δισκόπλακα", "δαγκάνα", "σιαγόνες", "ταμπούρα", "φρένα"]
"Ανάρτηση"     = ["αμορτισέρ", "ψαλίδι", "ψαλίδια", "ακρόμπαρο", "ακρόμπαρα", "μπαλάκι", "ζαμφόρ", "ροτούλα", "σινεμπλόκ", "σινεμπλόκς", "ελατήριο", "βάση αμορτισέρ"]
"Τιμόνι"       = ["ημιαξόνιο", "ημιαξόνια", "μπιλιοφόρο", "φούσκα", "κρεμαργιέρα", "άκρο τιμονιού"]
"Ψύξη"         = ["αντλία νερού", "τρόμπα νερού", "θερμοστάτης", "ψυγείο", "ανεμιστήρας", "βεντιλατέρ", "παγούρι", "κολάρο"]
"Ηλεκτρικά"    = ["πολλαπλασιαστής", "πολλαπλασιαστή", "μπουζί", "αισθητήρας", "αισθητήρα", "λάμδα", "ABS", "μίζα", "δυναμό", "εγκέφαλος"]
