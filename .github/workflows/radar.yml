name: Ραντάρ συζητήσεων

on:
  schedule:
    - cron: "7 * * * *"   # κάθε ώρα, στο 7ο λεπτό
  workflow_dispatch:       # κουμπί "Run workflow" για χειροκίνητο τρέξιμο

permissions:
  contents: write

concurrency: radar

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Τρέξιμο ραντάρ
        run: python radar.py
      - name: Αποθήκευση αναφοράς
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs seen.json
          git commit -m "Ενημέρωση αναφοράς" || exit 0
          git push
